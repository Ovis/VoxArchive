name: Bootstrap Temporary Manual Model Flow Fix

on:
  push:
    branches:
      - feature/transcription-foundation-refactoring

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/transcription-foundation-refactoring
      - name: Fix guard and remove bootstrap
        shell: bash
        run: |
          sed -i 's/git diff --cached --check$/git diff --cached --check --ignore-space-at-eol/' .github/workflows/temp-fix-manual-model-flow.yml
          rm .github/workflows/temp-fix-manual-model-flow-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix temporary workflow whitespace check'
          git push
