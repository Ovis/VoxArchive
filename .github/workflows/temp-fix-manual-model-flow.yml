name: Temporary Fix Manual Model Flow

on:
  push:
    branches:
      - feature/transcription-foundation-refactoring

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.head_commit.message != 'Fix manual missing-model application flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/transcription-foundation-refactoring
      - name: Refactor manual missing-model ownership
        shell: python
        run: python .github/scripts/temp_fix_manual_model_flow.py
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check --ignore-space-at-eol
          git commit -m 'Fix manual missing-model application flow'
          git push
