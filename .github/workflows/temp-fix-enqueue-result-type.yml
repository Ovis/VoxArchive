name: Temporary Fix Enqueue Result Type

on:
  push:
    branches:
      - feature/transcription-foundation-refactoring

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix enqueue result DTO conversion type'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/transcription-foundation-refactoring
      - name: Fix helper input type
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/VoxArchive.Application/TranscriptionApplicationService.cs')
          text = path.read_text(encoding='utf-8')
          old = 'private static VoxArchive.Application.Abstractions.TranscriptionEnqueueResult ToEnqueueResult(TranscriptionEnqueueResult result)'
          new = 'private static VoxArchive.Application.Abstractions.TranscriptionEnqueueResult ToEnqueueResult(TranscriptionQueueEnqueueResult result)'
          if old not in text:
              raise SystemExit('target helper signature not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/VoxArchive.Application/TranscriptionApplicationService.cs
          git diff --cached --check
          git commit -m 'Fix enqueue result DTO conversion type'
          git push
